aid: rational
name: Rational
description: >-
  Rational (rational.to) is a Y Combinator (S26) company building AI employees, or
  "AI coworkers," for accounting and finance teams. Its AI agents onboard themselves
  to a firm, build a company "brain," and perform recurring accounting work — accounts
  payable, AR collections, bookkeeping, bank reconciliation, document collection,
  expense review, and month-end close — while keeping postings, payment release, and
  policy-sensitive decisions behind explicit human approval gates with an inspectable
  review history. Founded in 2026 in San Francisco by Jibril Moinuddin and Christ Xu,
  Rational targets accounting firms and finance teams facing a structural capacity and
  labor shortage. As an early-stage company it currently exposes a marketing and
  agent-discovery surface (llms.txt, ai-discovery.json, RFC 9116 security.txt) rather
  than a public developer API; this profile captures that surface and will be enriched
  as a developer platform ships.
